---
name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ansible-lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ansible-lint
        uses: ansible/ansible-lint@fac2489f3e4ccffa83a40b839770abbf4ab52327 # v26.10.0

  actionlint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  zizmor:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: "false"
          annotations: "true"
          version: 1.31.1

  # Runs this action from the PR's own tree: a multi-line image-name with
  # padding must yield the trimmed first line, and an SBOM build must work.
  test-action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write a test build context
        run: |
          mkdir -p "$RUNNER_TEMP/ctx"
          printf 'FROM scratch\nCOPY Dockerfile /Dockerfile\n' > "$RUNNER_TEMP/ctx/Dockerfile"
      - id: build
        uses: ./ # zizmor: ignore[self-repository] the documented way to run the action under test
        with:
          cache-from: ""
          cache-to: ""
          checkout: "false"
          context: ${{ runner.temp }}/ctx
          image-name: "  ghcr.io/meysam81/build-docker-test  \nghcr.io/meysam81/build-docker-test2"
          persist-credentials: "false"
          platforms: linux/amd64
          push: "false"
          sbom: "true"
      - name: The first image name is picked and trimmed
        env:
          GOT: ${{ steps.build.outputs.image-name }}
        run: |
          test "$GOT" = "ghcr.io/meysam81/build-docker-test" || { echo "got: '$GOT'"; exit 1; }

  semantic-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release pushes with GITHUB_TOKEN itself (x-access-token URL)
          persist-credentials: false
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install bun deps
        run: bun install --frozen-lockfile
      - id: semantic-release
        name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bunx semantic-release
